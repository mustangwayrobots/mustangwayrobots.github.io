<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mustang Way Robots | STEM Project Portal</title>
  
  <!-- Orbitron & Inter Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050b14;
      --card-bg: #0c1524;
      --accent-blue: #38bdf8;
      --accent-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --btn-secondary-bg: #1e293b;
      --btn-secondary-hover: #334155;
      --admin-amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 60%),
        linear-gradient(to bottom, #050b14 0%, #030710 100%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      max-width: 800px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.75rem;
      font-weight: 900;
      color: var(--accent-blue);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 400;
    }

    /* Admin Indicator Badge */
    #admin-banner {
      display: none;
      background-color: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--admin-amber);
      color: var(--admin-amber);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      margin-top: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Controls & Search Bar Section */
    .controls-section {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    /* Base Card Styling */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--border-color), transparent);
      transition: background 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-blue);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
    }

    .card:hover::before {
      background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
    }

    /* Pinned Central Hub Special Card Style */
    .card-pinned {
      border-color: rgba(56, 189, 248, 0.5);
      background: linear-gradient(135deg, #0c1524 0%, #081220 100%);
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.15);
    }

    .card-pinned::before {
      background: linear-gradient(90deg, #38bdf8, #0284c7);
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      gap: 0.5rem;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.5px;
      line-height: 1.3;
    }

    /* Badge Styles */
    .badge-hub {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      background-color: var(--accent-blue);
      color: var(--bg-dark);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .badge-firmware {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      font-weight: 800;
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .badge-project {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      font-weight: 800;
      background-color: #1e293b;
      color: var(--text-muted);
      border: 1px solid #334155;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .card-description {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    /* Topic Tags Container */
    .topic-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 1.25rem;
    }

    .tag {
      font-size: 0.7rem;
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background-color: #162338;
      color: #7dd3fc;
      border: 1px solid #1e3a5f;
      text-transform: uppercase;
    }

    /* Button Group Layout */
    .button-group {
      display: flex;
      flex-direction: column;
