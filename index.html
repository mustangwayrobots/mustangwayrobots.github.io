<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mustang Way Robots | STEM Project Portal</title>
  
  <!-- Orbitron & Inter Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050b14;
      --card-bg: #0c1524;
      --accent-blue: #38bdf8;
      --accent-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --btn-secondary-bg: #1e293b;
      --btn-secondary-hover: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 60%),
        linear-gradient(to bottom, #050b14 0%, #030710 100%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      max-width: 800px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.75rem;
      font-weight: 900;
      color: var(--accent-blue);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 400;
    }

    /* Controls & Search Bar Section */
    .controls-section {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    /* Base Card Styling */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--border-color), transparent);
      transition: background 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-blue);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
    }

    .card:hover::before {
      background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
    }

    /* Pinned Central Hub Special Card Style */
    .card-pinned {
      border-color: rgba(56, 189, 248, 0.5);
      background: linear-gradient(135deg, #0c1524 0%, #081220 100%);
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.15);
    }

    .card-pinned::before {
      background: linear-gradient(90deg, #38bdf8, #0284c7);
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      gap: 0.5rem;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.5px;
      line-height: 1.3;
    }

    /* Badge Styles */
    .badge-hub {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      background-color: var(--accent-blue);
      color: var(--bg-dark);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .badge-firmware {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      font-weight: 800;
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .badge-project {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      font-weight: 800;
      background-color: #1e293b;
      color: var(--text-muted);
      border: 1px solid #334155;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .card-description {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    /* Topic Tags Container */
    .topic-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 1.25rem;
    }

    .tag {
      font-size: 0.7rem;
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background-color: #162338;
      color: #7dd3fc;
      border: 1px solid #1e3a5f;
      text-transform: uppercase;
    }

    /* Button Group Layout */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      text-decoration: none;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: var(--bg-dark);
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.2);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
    }

    .btn-secondary {
      background-color: var(--btn-secondary-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--btn-secondary-hover);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .status-msg {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-top: 4rem;
    }

    footer {
      margin-top: auto;
      padding-top: 4rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mustang Way Robots</h1>
    <p class="subtitle">STEM Robotics & Microcontroller Hub</p>
  </header>

  <div class="controls-section">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" class="search-input" placeholder="Search projects, hardware, firmware..." oninput="filterProjects()">
    </div>
  </div>

  <main class="container">
    <div id="repo-grid" class="grid"></div>
    <div id="status" class="status-msg">Scanning for organization projects...</div>
  </main>

  <footer>
    &copy; Mustang Way Robots • Downers Grove South High School
  </footer>

  <script>
    const GITHUB_USERNAME = 'mustangwayrobots';

    const ignoredRepos = [
      'mustangwayrobots',
      'mustangwayrobots.github.io'
    ];

    let allLoadedProjects = [];

    async function loadRobotRepositories() {
      const status = document.getElementById('status');

      try {
        const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100`, {
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        
        if (!response.ok) throw new Error('Failed to load project list');
        
        const repos = await response.json();

        allLoadedProjects = repos.filter(repo => {
          if (repo.fork || repo.archived) return false;
          if (ignoredRepos.includes(repo.name.toLowerCase())) return false;
          
          const topics = repo.topics || [];
          if (topics.includes('hidden')) return false;

          return true;
        });

        // Sort 'club-info-and-guides' to Position #1 permanently
        allLoadedProjects.sort((a, b) => {
          if (a.name.toLowerCase() === 'club-info-and-guides') return -1;
          if (b.name.toLowerCase() === 'club-info-and-guides') return 1;
          return 0;
        });

        if (allLoadedProjects.length === 0) {
          status.textContent = 'No projects available.';
          return;
        }

        status.style.display = 'none';
        renderProjects(allLoadedProjects);

      } catch (err) {
        console.error(err);
        status.textContent = 'Unable to load projects at this time.';
      }
    }

    function renderProjects(projects) {
      const grid = document.getElementById('repo-grid');
      grid.innerHTML = '';

      projects.forEach(repo => {
        const card = document.createElement('div');
        const isClubInfo = repo.name.toLowerCase() === 'club-info-and-guides';
        
        card.className = isClubInfo ? 'card card-pinned' : 'card';

        const firmwareKeywords = ['firmware', 'embedded', 'microcontroller', 'esp32', 'attiny', 'arduino'];
        const repoTopics = repo.topics || [];
        const hasFirmware = repoTopics.some(topic => firmwareKeywords.includes(topic.toLowerCase()));

        let iconSymbol = '📁';
        let badgeHTML = '<span class="badge-project">PROJECT</span>';

        if (isClubInfo) {
          iconSymbol = '📖';
          badgeHTML = '<span class="badge-hub">HUB</span>';
        } else if (hasFirmware) {
          iconSymbol = '⚡';
          badgeHTML = '<span class="badge-firmware">FIRMWARE</span>';
        }

        const formattedName = repo.name.replace(/[-_]/g, ' ');
        const cleanTitle = `${iconSymbol} ${isClubInfo ? 'Club Info & Guidelines' : formattedName}`;
        
        const description = repo.description 
          ? repo.description 
          : (isClubInfo ? 'Central hub for club operations, schedules, and teacher onboarding guides.' : 'Robotics project for Mustang Way Robots.');

        const visibleTags = repoTopics.filter(t => !['hidden', 'project', 'robotics'].includes(t.toLowerCase()));
        let tagsHTML = '';
        if (visibleTags.length > 0 && !isClubInfo) {
          tagsHTML = `<div class="topic-tags">${visibleTags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>`;
        }

        const hubUrl = `https://${GITHUB_USERNAME}.github.io/${repo.name}/`;

        let actionButtons = '';
        if (isClubInfo) {
          actionButtons = `
            <a href="${hubUrl}" class="btn btn-primary">
              🚀 Open Hub & Docs
            </a>
          `;
        } else {
          actionButtons = `
            <a href="${repo.html_url}" class="btn btn-secondary" target="_blank">
              💻 GitHub Repository & Docs
            </a>
          `;
          if (hasFirmware) {
            actionButtons += `
              <a href="https://${GITHUB_USERNAME}.github.io/${repo.name}/flash/" class="btn btn-primary">
                ⚡ Flash Firmware
              </a>
            `;
          }
        }

        card.innerHTML = `
          <div>
            <div class="card-header-row">
              <div class="card-title">${cleanTitle}</div>
              ${badgeHTML}
            </div>
            <div class="card-description">${description}</div>
            ${tagsHTML}
          </div>
          <div class="button-group">
            ${actionButtons}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function filterProjects() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allLoadedProjects.filter(repo => {
        const title = repo.name.toLowerCase().replace(/[-_]/g, ' ');
        const desc = (repo.description || '').toLowerCase();
        const topics = (repo.topics || []).join(' ').toLowerCase();
        return title.includes(query) || desc.includes(query) || topics.includes(query);
      });
      renderProjects(filtered);
    }

    loadRobotRepositories();
  </script>
</body>
</html>
