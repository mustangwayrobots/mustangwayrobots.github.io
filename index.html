<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mustang Way Robots | Project Portal</title>
  
  <!-- Orbitron & Inter Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050b14;
      --card-bg: #0c1524;
      --accent-blue: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --btn-secondary-bg: #1e293b;
      --btn-secondary-hover: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      max-width: 800px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--accent-blue);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 400;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-blue);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.15);
    }

    /* Pinned styling specifically for the Club Info card */
    .card-pinned {
      border-color: var(--accent-blue);
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.1);
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.75rem;
      letter-spacing: 1px;
    }

    .card-description {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
      flex-grow: 1;
    }

    /* Button Layout */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 0.50rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      text-decoration: none;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: var(--bg-dark);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .btn-secondary {
      background-color: var(--btn-secondary-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--btn-secondary-hover);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .status-msg {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      color: var(--text-muted);
      font-size: 1.2rem;
      margin-top: 4rem;
    }

    footer {
      margin-top: auto;
      padding-top: 4rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mustang Way Robots</h1>
    <p class="subtitle">STEM Robotics & Project Hub</p>
  </header>

  <main class="container">
    <div id="repo-grid" class="grid"></div>
    <div id="status" class="status-msg">Scanning for projects...</div>
  </main>

  <footer>
    &copy; Mustang Way Robots • Downers Grove South High School
  </footer>

  <script>
    const GITHUB_USERNAME = 'mustangwayrobots';

    // Self-referencing portal repos to skip rendering as project cards
    const ignoredRepos = [
      'mustangwayrobots',
      'mustangwayrobots.github.io'
    ];

    async function loadRobotRepositories() {
      const grid = document.getElementById('repo-grid');
      const status = document.getElementById('status');

      try {
        const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100`, {
          headers: {
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        
        if (!response.ok) throw new Error('Failed to load project list');
        
        const repos = await response.json();

        // Filter valid repositories, excluding forks, archives, self-repos, and any repo tagged with 'hidden'
        let validProjects = repos.filter(repo => {
          if (repo.fork || repo.archived) return false;
          if (ignoredRepos.includes(repo.name.toLowerCase())) return false;
          
          const topics = repo.topics || [];
          if (topics.includes('hidden')) return false; // Hides any repo with the 'hidden' topic tag

          return true;
        });

        // Sort so that 'club-info-and-guides' always floats to the top (position #1)
        validProjects.sort((a, b) => {
          if (a.name.toLowerCase() === 'club-info-and-guides') return -1;
          if (b.name.toLowerCase() === 'club-info-and-guides') return 1;
          return 0;
        });

        if (validProjects.length === 0) {
          status.textContent = 'No projects available.';
          return;
        }

        status.style.display = 'none';
        grid.innerHTML = '';

        validProjects.forEach(repo => {
          const card = document.createElement('div');
          
          const isClubInfo = repo.name.toLowerCase() === 'club-info-and-guides';
          card.className = isClubInfo ? 'card card-pinned' : 'card';

          const cleanTitle = isClubInfo ? '📖 Club Info & Guidelines' : repo.name.replace(/[-_]/g, ' ');
          const description = repo.description ? repo.description : 'Robotics project for Mustang Way Robots.';

          const firmwareKeywords = ['firmware', 'embedded', 'microcontroller', 'esp32', 'attiny', 'arduino'];
          const repoTopics = repo.topics || [];
          const hasFirmware = repoTopics.some(topic => firmwareKeywords.includes(topic.toLowerCase()));

          let actionButtons = `
            <a href="${repo.html_url}" class="btn ${isClubInfo ? 'btn-primary' : 'btn-secondary'}" target="_blank">
              ${isClubInfo ? '🚀 Open Hub & Docs' : '💻 GitHub Repository & Docs'}
            </a>
          `;

          if (hasFirmware && !isClubInfo) {
            actionButtons += `
              <a href="https://${GITHUB_USERNAME}.github.io/${repo.name}/flash/" class="btn btn-primary" target="_blank">
                ⚡ Flash Firmware
              </a>
            `;
          }

          card.innerHTML = `
            <div>
              <div class="card-title">${cleanTitle}</div>
              <div class="card-description">${description}</div>
            </div>
            <div class="button-group">
              ${actionButtons}
            </div>
          `;

          grid.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        status.textContent = 'Unable to load projects at this time.';
      }
    }

    loadRobotRepositories();
  </script>
</body>
</html>
